[package]
name = "sandlock-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "CLI for sandlock process sandbox"

[[bin]]
name = "sandlock"
path = "src/main.rs"

[features]
cow = ["sandlock-core/cow"]
profiles = ["sandlock-core/profiles", "dep:toml"]
image = ["cow", "sandlock-core/image"]
checkpoint = ["sandlock-core/checkpoint"]
default = ["http", "checkpoint", "image", "profiles", "cow"]
http = ["sandlock-core/http"]

[dependencies]
sandlock-core = { version = "0.9.1", path = "../sandlock-core", default-features = false, features = ["cli"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
toml = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
