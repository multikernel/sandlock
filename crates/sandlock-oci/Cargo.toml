[package]
name = "sandlock-oci"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OCI runtime shim for sandlock: namespace-less, Landlock-based"
readme = "README.md"

[lib]
name = "sandlock_oci"
path = "src/lib.rs"

[[bin]]
name = "sandlock-oci"
path = "src/main.rs"

[features]
cow = ["sandlock-core/cow"]
profiles = ["sandlock-core/profiles"]
image = ["cow", "sandlock-core/image"]
checkpoint = ["sandlock-core/checkpoint"]
default = ["http", "checkpoint", "image", "profiles", "cow"]
http = ["sandlock-core/http"]

[dependencies]
sandlock-core = { version = "0.9.1", path = "../sandlock-core", default-features = false }
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
tokio       = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
libc        = "0.2"
oci-spec    = { version = "0.7", features = ["runtime"] }

[dev-dependencies]
sandlock-fixtures = { path = "../sandlock-fixtures" }
tempfile = "3"
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
sandlock-core = { path = "../sandlock-core", default-features = false }