[package]
name = "sandlock-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Lightweight process sandbox using Landlock, seccomp-bpf, and seccomp user notification"

[dependencies]
libc = "0.2"
log = "0.4"
syscalls = { version = "0.8", default-features = false }
nix = { version = "0.29", features = ["process", "signal", "fs", "ioctl", "poll", "user"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rand = "0.8"
rand_chacha = "0.3"
goblin = "0.9"
uuid = { version = "1", features = ["v4"], optional = true }
bincode = { version = "1", optional = true }
serde_json = "1"
walkdir = { version = "2", optional = true }
ring = { version = "0.17", optional = true }
toml = { version = "0.8", optional = true }
pathdiff = { version = "0.2", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
rcgen = { version = "0.13", features = ["pem", "x509-parser"], optional = true }
hyper = { version = "1", features = ["server", "client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "native-tokio", "http1", "tls12", "logging"], optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
ruzstd = { version = "0.9", optional = true }
base64 = { version = "0.22", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
bollard = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }

[features]
cow = ["dep:walkdir", "dep:pathdiff", "dep:ring"]
profiles = ["dep:toml"]
image = ["cow", "dep:uuid", "dep:tar", "dep:flate2", "dep:ruzstd", "dep:base64", "dep:bollard", "dep:futures-util"]
checkpoint = ["dep:bincode"]
default = ["http", "checkpoint", "image", "profiles", "cow"]
cli = ["dep:clap"]
http = [
    "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:hyper-rustls",
    "dep:tokio-rustls", "dep:rustls", "dep:rcgen",
]

[dev-dependencies]
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
rustls-pemfile = "2"
x509-parser = "0.16"
